services:
  mkplace:
    build: .
    image: mkplace:latest
    container_name: mkplace
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/data
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb
    init: true
    restart: unless-stopped
